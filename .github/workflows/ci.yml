name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Lint (black --check)
        run: uv run black --check app tests

      - name: Testes
        run: uv run pytest -q
